name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Coverage report
        run: npx c8 --check-coverage --lines 85 npx tsx --test test/gateway.test.ts

      - name: Verify package contents
        run: npm pack --dry-run 2>&1

  # Verify the published tarball installs correctly with Yarn
  yarn-compat:
    name: Yarn Compatibility
    runs-on: ubuntu-latest
    needs: ci   # only run after the main CI job passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Pack tarball
        run: npm pack

      - name: Test install with Yarn Classic
        run: |
          mkdir /tmp/yarn-classic-test && cd /tmp/yarn-classic-test
          npm init -y
          npm install -g yarn@1
          yarn add $GITHUB_WORKSPACE/cmi-node-*.tgz
          node -e "const { CMIPaymentGateway } = require('cmi-node'); console.log('✅ Yarn Classic CJS import OK');"
          node --input-type=module -e "import { CMIPaymentGateway } from 'cmi-node'; console.log('✅ Yarn Classic ESM import OK');"

      - name: Test install with Yarn Berry (PnP)
        run: |
          mkdir /tmp/yarn-berry-test && cd /tmp/yarn-berry-test
          npm init -y
          corepack enable
          corepack prepare yarn@4 --activate
          yarn init -2
          yarn add $GITHUB_WORKSPACE/cmi-node-*.tgz
          yarn node -e "const { CMIPaymentGateway } = require('cmi-node'); console.log('✅ Yarn Berry CJS import OK');"
          yarn node --input-type=module -e "import { CMIPaymentGateway } from 'cmi-node'; console.log('✅ Yarn Berry ESM import OK');"
